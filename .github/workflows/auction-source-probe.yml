name: Auction Ubuntu source feasibility
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/auction-source-probe.yml'
      - 'tools/auction_preflight.py'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python tools/auction_preflight.py --source-only
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ubuntu-eltdx-probe
          path: data/auction_preflight/
