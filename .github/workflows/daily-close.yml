name: A-share daily close production

on:
  schedule:
    - cron: "30 7 * * 1-5"
  workflow_dispatch:
    inputs:
      trade_date:
        description: "Optional YYYY-MM-DD historical date"
        required: false
        type: string
      force:
        description: "Regenerate valid artifacts"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: a-share-daily-close
  cancel-in-progress: false

jobs:
  daily-close:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TZ: Asia/Shanghai
      TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run close pipeline with retries
        id: close
        shell: bash
        env:
          REQUESTED_TRADE_DATE: ${{ inputs.trade_date }}
          FORCE_REBUILD: ${{ inputs.force }}
        run: |
          set -o pipefail
          if [[ -n "$REQUESTED_TRADE_DATE" ]]; then
            args=(--date "$REQUESTED_TRADE_DATE")
          else
            args=(--latest --backfill-missing)
          fi
          if [[ "$FORCE_REBUILD" == "true" ]]; then
            args+=(--force)
          fi
          for attempt in 1 2 3; do
            if DAILY_CLOSE_ATTEMPT="$attempt" python tools/run_daily_close_pipeline.py "${args[@]}"; then
              exit 0
            else
              code=$?
            fi
            # Missing credentials cannot be repaired by sleeping and retrying.
            [[ "$code" == "3" ]] && exit 3
            [[ "$attempt" == "3" ]] && exit 1
            sleep $((attempt * 60))
          done
      - name: Commit manifests and generated artifacts
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market_packets data/daily_runs data/formal_review_support reports/market_packets
          if [[ -d data/formal_reviews ]]; then git add data/formal_reviews; fi
          git add data/formal_review_queue data/chatgpt_review_inputs
          if [[ -d data/official_reviews ]]; then git add data/official_reviews; fi
          git add -f data/inflection/*.json data/review_intelligence/*.json \
            data/capital_preference/*.json data/review_context/*.json \
            data/feedback_records research_feedback
          git diff --cached --quiet && exit 0
          git commit -m "data: advance daily close production"
          git push origin HEAD:main
      - name: Commit failed daily close manifest only
        if: ${{ always() && steps.close.outcome == 'failure' }}
        run: python tools/publish_daily_close_failure.py
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: daily-close-diagnostics-${{ github.run_id }}
          path: |
            data/daily_runs/
          if-no-files-found: ignore
          retention-days: 14
